# ============================================================================
# dsh-cherry-kb-bridge —— DSH bundle patch
# ============================================================================
# 把 Cherry Studio 本地知识库桥接工具挂进 web profile 的宿主组合层。
#
# 安装方式：
#   dsh plugin --profile web add link:dsh-cherry-kb-bridge
# 卸载方式：
#   dsh plugin --profile web remove dsh-cherry-kb-bridge
#
# 该行注册在宿主组合（host composition）里，因此**所有预设、所有会话**
# 都能调用这 3 个工具。全部纯只读，绝不写入任何 Cherry Studio 数据。
# ============================================================================

- insert:
    - id: dsh-cherry-kb-bridge
      name: dsh-cherry-kb-bridge