# ============================================================================
# dsh-loop-guard —— DSH bundle patch
# ============================================================================
# 本文件把护栏插件插入 host 组合。
#
# 为什么挂在 host 平面而不是 agent 预设：
#   护栏要覆盖「所有会话 × 所有子代理 × 所有辅助模型调用（标题、压缩）」
#   的每一次模型请求，这正是 host 组合的职责范围。放进预设的话，每个会话
#   各拿一份实例，既覆盖不全，也会在第二次挂载时冲突。
#
# 安装：
#   dsh plugin --profile web add link:dsh-loop-guard
#
# 调参：
#   不要改本文件。本行刻意不写 config，好让插件用它自己的默认值；要调整就
#   在 profile 的 cordis.patch.yml 里按 id 覆盖 —— 注意 patch 语义是「整体
#   替换 config」，所以要重述每一个想保留的字段。
#
#   示例（放进 profiles/web/cordis.patch.yml）：
#     - id: loop-guard
#       config:
#         maxOutputTokens: 120000
#         maxDurationMs: 900000
#         logTrips: true
#         repeat:
#           minChars: 3000
#
# 卸载：删掉 profile 的 cordis.patch.yml 里对应的覆盖行，并从 profile
#       package.json 的 dependencies / dsh.profile.bundles 中移除本包。
# ============================================================================

- insert:
    - id: loop-guard
      name: dsh-loop-guard
